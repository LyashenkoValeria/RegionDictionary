openapi: 3.0.0
info:
  title: Region Dictionary specification
  version: 1.0.0
servers:
  - url: http://localhost:8080
    description: Java Server
tags:
  - name: RegionController
    description: Доступные операции для регионов
paths:
  /api/v1/regions:
    get:
      tags:
        - RegionController
      description: Возвращает список всех регионов
      summary: Метод получения всех регионов
      operationId: findAll
      responses:
        '200':
          description: Успешный ответ со списком регионов
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Region'

  /api/v1/region/{code}:
    get:
      tags:
        - RegionController
      description: Возвращает регион по его коду
      summary: Метод получения одного региона
      operationId: findByCode
      parameters:
        - name: code
          in: path
          required: true
          description: Идентификатор региона
          schema:
            type: integer
      responses:
        '200':
          description: Успешный ответ с регионом
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Region'
        '404':
          description: Регион с указанным кодом не найден
          content:
            text/plain:
              schema:
                type: string
                example: "Region 1000 not found"

    delete:
      tags:
        - RegionController
      description: Удалеет один регион по коду
      summary: Метод удаления региона
      operationId: delete
      parameters:
        - name: code
          in: path
          required: true
          description: Идентификатор региона
          schema:
            type: integer
      responses:
        '200':
          description: Успешный ответ об удалении региона

  /api/v1/region:
    post:
      tags:
        - RegionController
      description: Создаёт новый регион
      summary: Метод создания региона
      operationId: create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Region'
      responses:
        '200':
          description: Успешный ответ о создании региона
        '400':
          description: Регион с указанным кодом уже существует
          content:
            text/plain:
              schema:
                type: string
                example: "Region 1000 already exists"

    put:
      tags:
        - RegionController
      description: Обновляет информацию о регионе в базе данных
      summary: Метод изменения региона
      operationId: update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Region'
      responses:
        '200':
          description: Успешный ответ об изменении данных региона
        '404':
          description: Регион с указанным кодом не найден
          content:
            text/plain:
              schema:
                type: string
                example: "Region 1000 not found"

components:
  schemas:
    Region:
      type: object
      required:
        - regionCode
        - regionName
      properties:
        regionCode:
          type: integer
          example: 77
        regionName:
          type: string
          example: Москва